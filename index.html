<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="/hangul/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Apprends le coréen : 510 mots, flashcards, quiz et audio.">

  <!-- Opens full screen, without Safari's bars, once added to the home screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hangul">
  <meta name="theme-color" content="#FF6B6B">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hangul</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #F2F2F7; }
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: linear-gradient(135deg, #FF6B6B, #FF8E72 60%, #FFB199);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      transition: opacity .4s ease;
    }
    #loader .logo {
      width: 108px; height: 108px; border-radius: 30px; background: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 60px; font-weight: 800; color: #FF6B6B;
      box-shadow: 0 14px 30px rgba(0,0,0,.15);
      animation: pop .9s cubic-bezier(.34,1.56,.64,1) both;
    }
    #loader .name { color: #fff; font-size: 34px; font-weight: 800; letter-spacing: -1px; }
    #loader .bar { width: 120px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.3); overflow: hidden; }
    #loader .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #fff; border-radius: 4px;
      animation: slide 1.1s ease-in-out infinite;
    }
    #help {
      display: none; flex-direction: column; align-items: center; gap: 10px;
      margin: 8px 24px 0; color: #fff; font-size: 15px; font-weight: 600; text-align: center;
    }
    #help .err {
      max-width: 300px; max-height: 120px; overflow: auto; white-space: pre-wrap; word-break: break-word;
      font: 11px/1.4 ui-monospace, Menlo, monospace; background: rgba(0,0,0,.18);
      border-radius: 10px; padding: 8px 10px; margin: 0;
    }
    #help button {
      border: 0; border-radius: 14px; padding: 12px 22px; background: #fff; color: #FF6B6B;
      font: 700 16px -apple-system, BlinkMacSystemFont, sans-serif;
    }
    @keyframes pop { from { transform: scale(.4); opacity: 0 } to { transform: scale(1); opacity: 1 } }
    @keyframes slide { from { transform: translateX(-100%) } to { transform: translateX(250%) } }
  </style>
</head>
<body>
  <div id="loader">
    <div class="logo">한</div>
    <div class="name">Hangul</div>
    <div class="bar"></div>
    <div id="help">
      <div>Le chargement prend trop de temps.</div>
      <pre class="err"></pre>
      <button onclick="hardReload()">Réessayer</button>
    </div>
  </div>
  <script>
    // Drop any offline copy left by an older version so the phone always runs the latest build.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
    }
    if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });

    var bootErrors = [];
    window.addEventListener('error', function (e) { bootErrors.push(e.message || String(e)); });
    window.addEventListener('unhandledrejection', function (e) { bootErrors.push(String(e.reason)); });

    var started = false;
    window.addEventListener('flutter-first-frame', function () {
      started = true;
      var l = document.getElementById('loader');
      l.style.opacity = '0';
      setTimeout(function () { l.remove(); }, 400);
    });

    // If nothing showed up after 15 s, say so instead of spinning forever.
    setTimeout(function () {
      if (started) return;
      var help = document.getElementById('help');
      help.querySelector('.err').textContent = bootErrors.length ? bootErrors.slice(0, 3).join('\n') : 'Aucune erreur détectée (connexion lente ?)';
      help.style.display = 'flex';
    }, 15000);

    function hardReload() {
      Promise.all([
        'serviceWorker' in navigator ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : null,
        window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null
      ]).then(function () { location.replace(location.pathname + '?v=' + Date.now()); });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
